{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell Item</title>
    <link rel="stylesheet" href="{% static 'Styles/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2>Sell Item: {{ item.name }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="sold_qty" class="form-label">Quantity to Sell</label>
            <input type="number" class="form-control" id="sold_qty" name="sold_qty" min="1" max="{{ item.quantity }}" required>
        </div>
        <button type="submit" class="btn btn-success">Sell</button>
        <a href="{% url 'view_item' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
